<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz About Me (louise)</h1>
    <hr />
    <!-- Movie Question -->
    <div class="container">
    <form id="movie-form">
      <div class="q1">
      <label>
        What is my favorite movie?<br>
        <select id="movie-answer">
          <option value="movie1">Drop Dead Gorgeous</option>
          <option value="movie2">Princess Bride</option>
          <option value="movie3">Pride and Prejudice (2011)</option>
          <option value="movie4">Twilight</option>
        </select>
      </label>
      <br>
      <button type="submit">Check Movie Answer</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
      <img class="movie-img" width="100px">
    </div>
    
  </div>
    <!-- Book Question -->
     <div class="q2">
    <form id="book-form">
      <label>
        What is my favorite book?
        <select id="book-answer">
          <option value="book1">Frankenstein by Mary Shelley</option>
          <option value="book2">Portrait of Dorian Grey by Oscar Wild</option>
          <option value="book3">The Little Mermaid by Hans Christian Anderson</option>
          <option value="book4">Wuthering Heights by Emily Bronte</option>
        </select>
      </label>
      <button type="submit">Check Book Answer</button>
    </form>
    <div id="book-result">
      <p id="book-text"></p>
      <img class="book-img" width="100px">
    </div>
  </div>
    <!-- Album Question -->
     <div class="q3">
    <form id="album-form">
      <label>
        What is my favorite album?
        <select id="album-answer">
          <option value="album1">Like a Prayer by Madonna</option>
          <option value="album2">Purple Rain by Prince</option>
          <option value="album3">Lifes Too Good by The Sugarcubes</option>
          <option value="album4">Kisses from My Sweetheart the Drunk by Jeff Buckley</option>
        </select>
      </label>
      <button type="submit">Check album Answer</button>
    </form>
    <div id="album-result">
      <p id="album-text"></p>
      <img class="album-img" width="100px">
    </div>
  </div>
    <!-- Painting Question -->
     <div class="q4">
    <form id="painting-form">
      <label>
        What is my favorite panting?
        <select id="painting-answer">
          <option value="painting1">Dream of the Shepherd by Ferdinand Hodler</option>
          <option value="painting2">Music by Gustav Klimpt</option>
          <option value="painting3">Yellow Dancers (In the Wings) by Eduard Degas</option>
          <option value="painting4">Portrait of Madame X by John Singer Sargent</option>
        </select>
      </label>
      <button type="submit">Check painting Answer</button>
    </form>
    <div id="painting-result">
      <p id="painting-text"></p>
      <img class="painting-img" width="100px">
    </div>
    </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie2") {
          $("#movie-text").text("Yep");
          $(".movie-img").attr("src", "https://m.media-amazon.com/images/M/MV5BMjM0Nzk5NTc4OV5BMl5BanBnXkFtZTcwMDA2MzgxNA@@._V1_.jpg");
        } 
        else {
          $("#movie-text").text("Try Again!");
        }
      });

      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book4") {
          $("#book-text").text("Yep");
          $(".book-img").attr("src", "https://www.hachettebookgroup.com/wp-content/uploads/2025/04/9781435171503_d23c00.jpg?w=419");
        } 
        else {
          $("#book-text").text("Try Again!");
        }
      });

      //=======================Album Question jQuery Code
      $("#album-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#album-answer");
        var answer = $answer.val();

        if (answer === "album3") {
          $("#album-text").text("Yep");
          $(".album-img").attr("src", "https://cdn.shoplightspeed.com/shops/636018/files/58615043/132x132x1/one-little-independent-sugarcubes-the-lifes-too-go.jpg");
        } 
        else {
          $("#album-text").text("Try Again!");
        }
      });

      //=======================Painting Question jQuery Code
      $("#painting-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#painting-answer");
        var answer = $answer.val();

        if (answer === "painting1") {
          $("#painting-text").text("Yep");
          $(".painting-img").attr("src", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTirJcvX0eFYawJl7_jjOlzcz06pqq4_1yKlA&s");
        } 
        else {
          $("#painting-text").text("Try Again!");
        }
      });
      
    </script>
  </body>
